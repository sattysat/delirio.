<script>
(()=>{
/* ====== TUS TEXTOS (edítalos aquí) ======
   x,y = casilla del parque (el mapa mide 48x34). Usa \n para saltos de línea.
   Las notas se leen al acercarte; las lápidas igual. */
const NOTAS=[
 {x:22,y:29,t:'Nota 1: ey, ola pequeña... estas perdida?. mira por aqui hay un par de carteles con notas escritas...buscalos, estan bien escondidos. por cierto en el monumente que esta al final de la calle, te deje algo abrelo con "E", jeje, buena suerte mi niña'},
 {x:17,y:27,t:'Nota 2: te sientes muy onichan?.'},
 {x:22,y:4,t:'Nota 3: hola lelita.'},
 {x:41,y:8,t:'Nota 4: ella es tsundere.'},
 {x:7,y:22,t:'Nota 5: wtf como encontraste esta? jeje, tonota. cristo es lo mas vello eimana'},
 {x:34,y:26,t:'Nota 6: when por que me mencionaron tanto en tus mensajes anonimos? acaso soy famoso?                MAMA SOY FAMOSO.'}
];
const LAPIDAS=[
 {x:42,y:22,t:'wilson'},
 {x:43,y:22,t:'un gato ahi, no me acuerdo el nombre'}
];
/* ====== PANEL DEL MONUMENTO (edítalo aquí) ======
   src = ruta de la imagen/audio (por ejemplo 'fotos/hueles1.jpg' o 'musica/cancion.mp3'),
   relativa a este archivo. Si src está vacío se ve un marco vacío. t = texto/pie de foto. */
const PANEL={
 titulo:'',
 huele:{titulo:'¿a qué hueles?',texto:'',fotos:[{src:'imagenes/foto1.jpg',t:'Foto 1'},{src:'imagenes/fotocerezo.jpg',t:'Foto 2'},{src:'imagenes/macadamia.webp',t:'Foto 3'}]},
 suena:{titulo:'¿a qué suenas?',pistas:[{src:'cancionespecificas/amtrak.webm',t:'amtrak - de los retros'},{src:'cancionespecificas/cancionstrokes.webm',t:'Call It Fate, Call It Karma - de the strokes'},{src:'cancionespecificas/macherie.webm',t:'ma cherie - de malice mizer '}]},
 sabe:{titulo:'¿a qué sabes?',fotos:[{src:'imagenes/helado pistacho.jpg',t:'Foto 1'},{src:'imagenes/cerezas.webp',t:'Foto 2'},{src:'imagenes/croissant.webp',t:'Foto 3'}]},
 color:{titulo:'¿cuál es tu color?',fotos:[{src:'imagenes/morado1.jpg',t:'Foto 1'},{src:'imagenes/morado2.webp',t:'Foto 2'},{src:'imagenes/morado3.webp',t:'Foto 3'}]},
 carta:{titulo:'una carta',fecha:'',para:'hola tu,',texto:'querida leshley mariell roque ortiz (creo que en alguna parte habia leido este comienzo, en un musical o algo asi, espero y siga gustandote y vallas por la 7ma vez que lo veas). \n\nesto, fue lo mas bello que vi pasar. te amo y... Lo que siento por ti no es algo que todo el mundo vea. a veces no es algo que pueda demostrar. Dicen que los hechos demuestran el amor la verdad o algo asi, talvez lo allá demostrado alguna vez y espero que las veces que lo allá demostrado allan sido mejor a las veces que no lo hice y que talvez sean mas las que no las hice. creo que esta sera la ultima carta que redactare, quiero aprovar cada decision que tomaras, quiero que allas sentido de mi lo mismo que siento yo por ti. Perdoname por las veces que te hice sentir mal, nunca me perdonare por no aprovechar bien las cosas contigo, ser un maldito estupido, alguien timido e inmaduro.\n\nnunca me arrepentire de ser tu novio, eres la persona mas hermosa que vi, aunque tu no te das cuenta de lo bella que eres, me encantas lesly, me encanta tu forma de amar, eres especial, con doble sentido claro, no se puede negar que soy yo jeje.\n\npor cierto lo de la primera foto a lo que sabes es un helado de pistacho, muy bueno.\n\npor cierto, soy alergico a los gatos. ',firma:'ATT: Satty, feliz mesario, te amo'}
};
const TS=16,MW=48,MH=34,$=s=>document.querySelector(s);
const cv=$('#cv'),cx=cv.getContext('2d');
let W,H,Z=3;
function fit(){const d=devicePixelRatio||1;cv.width=innerWidth*d;cv.height=innerHeight*d;W=cv.width;H=cv.height;Z=Math.max(1,Math.floor(Math.min(W/(18*16),H/(11*16))))}
addEventListener('resize',fit);fit();
const rng=s=>()=>{s|=0;s=s+0x6D2B79F5|0;let t=Math.imul(s^s>>>15,1|s);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296};
const mk=(w,h)=>{const c=document.createElement('canvas');c.width=w;c.height=h;return c};
const clamp=(v,a,b)=>Math.max(a,Math.min(b,v));
const key=(x,y)=>x+','+y,blocked=new Set();
const block=(x,y,w=1,h=1)=>{for(let i=0;i<w;i++)for(let j=0;j<h;j++)blocked.add(key(x+i,y+j))};
const free=(x,y)=>x>=0&&y>=0&&x<MW&&y<MH&&!blocked.has(key(x,y));

/* ---------- mapa ---------- */
const POND={x:10,y:27,rx:6,ry:3.8};
const inPond=(x,y)=>((x+.5-POND.x)/POND.rx)**2+((y+.5-POND.y)/POND.ry)**2<=1;
const noTree=(x,y)=>x>=25&&x<=45&&y>=21&&y<=28;
const PLZ=[[24,17,5.6],[38,7,3.2],[10,22,2.4]];
const isPath=(x,y)=>{if(inPond(x,y))return false;
  if(y>=24&&y<=25&&x>=25&&x<=44)return true;
  if(y>=16&&y<=17&&x>=2&&x<=45)return true;
  if(x>=23&&x<=24&&y>=5&&y<=33)return true;
  if(x>=10&&x<=11&&y>=17&&y<=22)return true;
  if(x>=37&&x<=38&&y>=9&&y<=16)return true;
  return PLZ.some(p=>Math.hypot(x+.5-p[0],y+.5-p[1])<=p[2])};
const dC=(x,y)=>Math.hypot(x+.5-24,y+.5-17);

/* ---------- suelo (prerenderizado) ---------- */
const ground=mk(MW*16,MH*16),G=ground.getContext('2d');
(function(){const r=rng(11),R=(c,x,y,w,h)=>{G.fillStyle=c;G.fillRect(x,y,w,h)};
  const GR=['#82c77c','#7bc077','#89cd82','#76bb72'];
